[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pm-eval"
version = "0.2.0"
description = "Provider-agnostic eval harness for grading LLM and agent output against rubrics. The Evaluation rung of The PM Scaffold."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Nic Hansen" }]
requires-python = ">=3.10"
keywords = ["evals", "llm", "agent-evaluation", "pm-scaffold", "rubric", "grader"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "pyyaml>=6.0",
    "click>=8.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40.0"]
openai = ["openai>=1.50.0"]
local = ["ollama>=0.3.0"]
all = ["anthropic>=0.40.0", "openai>=1.50.0", "ollama>=0.3.0"]
dev = ["pytest>=7.0", "ruff>=0.1.0", "mypy>=1.0"]

[project.scripts]
pm-eval = "pm_eval.cli:main"

[project.urls]
Homepage = "https://github.com/nich9000/pm-eval"
Framework = "https://github.com/nich9000/pm-scaffold"
Issues = "https://github.com/nich9000/pm-eval/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
